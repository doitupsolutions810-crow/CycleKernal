version: "3.9"

services:
  ws-relay:
    build:
      context: ../src/relay
      dockerfile: Dockerfile
    container_name: ck-ws-relay
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - CK_RELAY_QUEUE_MAX=${CK_RELAY_QUEUE_MAX:-32}
    networks: [cyclekernel-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  cognitive-bridge:
    build:
      context: ../src/bridge
      dockerfile: Dockerfile
    container_name: ck-cognitive-bridge
    ports:
      - "8090:8090"
    environment:
      # master/.env.example lists these. An empty token keeps /events closed.
      - WS_RELAY_URL=${WS_RELAY_URL:-ws://ws-relay:8081/ws/out}
      - RELAY_URL=${RELAY_URL:-ws://ws-relay:8081/ws/out}
      - CK_SYNTHETIC=${CK_SYNTHETIC:-0}
      - CK_EVENTS_TOKEN=${CK_EVENTS_TOKEN:-}
      - CK_EVENTS_TOKEN_PREVIOUS=${CK_EVENTS_TOKEN_PREVIOUS:-}
      - CK_EVENTS_MAX_BYTES=${CK_EVENTS_MAX_BYTES:-65536}
      - CK_EVENTS_MAX_RECENT=${CK_EVENTS_MAX_RECENT:-100}
    depends_on:
      ws-relay:
        condition: service_healthy
    networks: [cyclekernel-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: ck-orchestrator
    ports:
      - "8100:8100"
    environment:
      - BRIDGE_URL=http://cognitive-bridge:8090
      - TERMINAL_URL=http://terminal-runtime:8200
      - CHAT_URL=http://chat:8300
      - ARTIFACT_ROOT=/artifacts
    volumes:
      - ck-artifacts:/artifacts
    depends_on:
      cognitive-bridge:
        condition: service_healthy
      terminal-runtime:
        condition: service_started
    networks: [cyclekernel-net]
    restart: unless-stopped

  terminal-runtime:
    build:
      context: ./src/terminal
      dockerfile: Dockerfile
    container_name: ck-terminal-runtime
    ports:
      - "8200:8200"
    volumes:
      - ck-artifacts:/artifacts
    networks: [cyclekernel-net]
    restart: unless-stopped

  chat:
    build:
      context: ./src/chat
      dockerfile: Dockerfile
    container_name: ck-chat
    ports:
      - "8300:8300"
    environment:
      - BRIDGE_URL=http://cognitive-bridge:8090
      - ORCH_URL=http://orchestrator:8100
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      - cognitive-bridge
      - orchestrator
    networks: [cyclekernel-net]
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: ck-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on: [orchestrator, chat]
    networks: [cyclekernel-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ck-redis
    ports:
      - "6379:6379"
    networks: [cyclekernel-net]
    restart: unless-stopped

networks:
  cyclekernel-net:
    driver: bridge
    name: cyclekernel-net

volumes:
  ck-artifacts:
    name: ck-artifacts
