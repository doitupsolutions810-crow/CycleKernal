<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CycleKernel Master · Ghost Colony v4.0</title>
<style>
  :root {
    --bg: #0a0e17; --panel: #111827; --border: #1f2937;
    --text: #e5e7eb; --muted: #9ca3af; --accent: #22d3ee;
    --divergent: #a78bfa; --convergent: #34d399; --survival: #f87171; --neutral: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
  h1 { color: var(--accent); font-size: 1.4rem; letter-spacing: .06em; }
  .sub { color: var(--muted); font-size: .75rem; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 12px; }
  .mood { font-size: 1.6rem; font-weight: 600; margin-bottom: 6px; }
  .mood.divergent { color: var(--divergent); } .mood.convergent { color: var(--convergent); }
  .mood.survival { color: var(--survival); } .mood.neutral, .mood.balanced-tension { color: var(--neutral); }
  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
  .metric { background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; }
  .metric .l { font-size: .6rem; color: var(--muted); text-transform: uppercase; }
  .metric .v { font-size: 1.1rem; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: #1e293b; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: .7rem; }
  textarea, input, button { width: 100%; font-family: inherit; font-size: .85rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); padding: 10px; margin-top: 8px; }
  button { background: var(--accent); color: #0a0e17; font-weight: 600; cursor: pointer; border: none; }
  button:disabled { opacity: .5; cursor: wait; }
  pre { background: #0f172a; border-radius: 8px; padding: 12px; font-size: .75rem; overflow: auto; max-height: 280px; margin-top: 10px; white-space: pre-wrap; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div style="max-width:1100px;margin:0 auto 16px;">
    <h1>CYCLEKERNEL MASTER · GHOST COLONY</h1>
    <div class="sub"><span class="status-dot"></span>v4.0 Closed-Loop · Research · Planning · Coding · Terminal Sandbox</div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Cognitive State</h2>
      <div id="mood" class="mood neutral">neutral</div>
      <div id="explanation" style="color:var(--muted);font-size:.85rem;"></div>
      <div class="metrics">
        <div class="metric"><div class="l">Entropy</div><div class="v" id="entropy">—</div></div>
        <div class="metric"><div class="l">Coupling</div><div class="v" id="coupling">—</div></div>
        <div class="metric"><div class="l">Core</div><div class="v" id="core">—</div></div>
      </div>
      <div class="chips" id="traits"></div>
    </div>

    <div class="panel">
      <h2>Pipeline Goal</h2>
      <textarea id="goal" rows="3" placeholder="Describe the goal for the colony…">Build a small Python function that returns the current colony mood</textarea>
      <button id="runBtn" onclick="runPipeline()">Run Full Pipeline</button>
      <div style="margin-top:10px;font-size:.7rem;color:var(--muted);">research → planning → coding → terminal sandbox → feedback</div>
    </div>

    <div class="panel full">
      <h2>Pipeline Output</h2>
      <pre id="out">Awaiting goal…</pre>
    </div>
  </div>

<script>
  const ORCH = location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:8100"
    : "";

  async function refreshMood() {
    try {
      const r = await fetch((ORCH || "") + "/v1/mood");
      const s = await r.json();
      const el = document.getElementById("mood");
      el.textContent = s.mood || "neutral";
      el.className = "mood " + (s.mood || "neutral");
      document.getElementById("explanation").textContent = s.explanation || "";
      document.getElementById("entropy").textContent = (s.entropy ?? 0).toFixed(2);
      document.getElementById("coupling").textContent = (s.coupling ?? 0).toFixed(3);
      document.getElementById("core").textContent = (s.core ?? 0).toFixed(2);
      document.getElementById("traits").innerHTML = (s.traits || []).map(t => `<span class="chip">${t}</span>`).join("");
    } catch (e) {
      document.getElementById("mood").textContent = "bridge offline";
    }
  }

  async function runPipeline() {
    const btn = document.getElementById("runBtn");
    const out = document.getElementById("out");
    btn.disabled = true;
    out.textContent = "Pipeline running…";
    try {
      const r = await fetch((ORCH || "") + "/v1/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal: document.getElementById("goal").value, auto_execute: true })
      });
      const data = await r.json();
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      out.textContent = "Error: " + e.message;
    } finally {
      btn.disabled = false;
      refreshMood();
    }
  }

  refreshMood();
  setInterval(refreshMood, 2000);
</script>
</body>
</html>
