server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/simulation/ {
        proxy_pass http://simulation:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/monitoring/ {
        proxy_pass http://monitoring:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/chat/ {
        proxy_pass http://chat:8300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/colony/ {
        proxy_pass http://colony:8500/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {

        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://simulation:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
