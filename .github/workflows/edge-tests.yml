name: CycleKernel edge tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cyclekernel-ci-${{ github.run_id }}
      MONGO_INITDB_ROOT_PASSWORD: ci-only-mongo-password-do-not-use-outside-ci
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-do-not-use-outside-ci
      EDGE_SOAK_REQUESTS: "2000"
      EDGE_SOAK_WORKERS: "48"
      EDGE_SOAK_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - name: Start the Compose test stack
        run: docker compose up --pull always -d --build
      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          for service in simulation monitoring cognitive-bridge terminal-runtime orchestrator chat colony frontend; do
            for attempt in {1..60}; do
              state="$(docker compose ps --format json "$service" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("Health", ""))')"
              [[ "$state" == healthy ]] && break
              [[ "$attempt" -lt 60 ]] || { docker compose logs "$service"; exit 1; }
              sleep 2
            done
          done
      - name: Run focused agent runtime unit tests (timeouts, cancellation, DAG)
        run: docker compose exec -T chat python - < scripts/agent_runtime_unit_tests.py
      - name: Run robust chat and agent edge suite
        run: python3 scripts/edge_test.py http://127.0.0.1:8080
      - name: Verify eight release image manifests (amd64 + arm64)
        env:
          CYCLEKERNEL_IMAGE_TAG: 22b25ae654fac11be0b08e2d60bae0396293441e
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ok=0
          for service in frontend simulation monitoring bridge terminal orchestrator chat colony; do
            ref="ghcr.io/$GITHUB_REPOSITORY_OWNER/cyclekernel-$service:$CYCLEKERNEL_IMAGE_TAG"
            archs="$(docker buildx imagetools inspect --raw "$ref" | python3 -c 'import json,sys; x=json.load(sys.stdin); print(",".join(sorted({m.get("platform",{}).get("architecture") for m in x.get("manifests",[]) if m.get("platform",{}).get("os")=="linux" and m.get("platform",{}).get("architecture") not in (None,"unknown")})))')"
            echo "$service: ${archs:-MISSING}"
            [[ "$archs" == "amd64,arm64" ]]
            ok=$((ok + 1))
          done
          echo "verified $ok/8"
      - name: Show service state on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
