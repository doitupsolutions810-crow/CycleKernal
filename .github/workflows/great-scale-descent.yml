name: Great Scale descent integration

on:
  pull_request:
    paths:
      - "backend/descent_engine.py"
      - "backend/ns_fusion.py"
      - "backend/simulation_core.py"
      - "backend/test_descent_engine.py"
      - "backend/test_ns_fusion.py"
      - "backend/test_cyclekernel_descent.py"
      - ".github/workflows/great-scale-descent.yml"
  push:
    branches: [main]
    paths:
      - "backend/descent_engine.py"
      - "backend/ns_fusion.py"
      - "backend/simulation_core.py"
      - "backend/test_descent_engine.py"
      - "backend/test_ns_fusion.py"
      - "backend/test_cyclekernel_descent.py"
      - ".github/workflows/great-scale-descent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-sim.txt
      - name: Install simulation dependencies
        run: python -m pip install -r requirements-sim.txt
        working-directory: backend
      - name: Run descent, fusion, and scheduler integration tests
        run: python -m unittest -v test_descent_engine test_ns_fusion test_cyclekernel_descent
        working-directory: backend
