name: cyclekernel

services:
  simulation:
    image: cyclekernel-simulation:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.sim
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    expose: ["5000"]
    volumes:
      - simulation-logs:/app/logs
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  monitoring:
    image: cyclekernel-monitoring:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.mon
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://cyclekernel:${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}@mongodb:27017/cyclekernel?authSource=admin
      REDIS_URL: redis://redis:6379
    expose: ["3000"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  cognitive-bridge:
    image: cyclekernel-bridge:latest
    build:
      context: ./master/src
      dockerfile: bridge/Dockerfile
    environment:
      PYTHONPATH: /app:/app/src
      BRIDGE_USE_NS: "1"
    expose: ["8090"]
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  terminal-runtime:
    image: cyclekernel-terminal:latest
    build:
      context: ./master/src/terminal
      dockerfile: Dockerfile
    environment:
      ARTIFACT_ROOT: /artifacts
      CK_TERMINAL_SERVICE_TOKEN: ${CK_TERMINAL_SERVICE_TOKEN:-}
    expose: ["8200"]
    volumes:
      - ck-artifacts:/artifacts
    networks: [runner]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  orchestrator:
    image: cyclekernel-orchestrator:latest
    build:
      context: ./master
      dockerfile: Dockerfile.master
    environment:
      BRIDGE_URL: http://cognitive-bridge:8090
      TERMINAL_URL: http://terminal-runtime:8200
      CK_TERMINAL_SERVICE_TOKEN: ${CK_TERMINAL_SERVICE_TOKEN:-}
      CK_TOOL_EXECUTION_TOKEN: ${CK_TOOL_EXECUTION_TOKEN:-}
      CHAT_URL: http://chat:8300
      ARTIFACT_ROOT: /artifacts
      PYTHONPATH: /app
    expose: ["8100"]
    volumes:
      - ck-artifacts:/artifacts
    depends_on:
      cognitive-bridge:
        condition: service_healthy
      terminal-runtime:
        condition: service_healthy
    networks: [app, runner]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  chat:
    image: cyclekernel-chat:latest
    build:
      context: ./master/src
      dockerfile: chat/Dockerfile
    environment:
      BRIDGE_URL: http://cognitive-bridge:8090
      ORCH_URL: http://orchestrator:8100
      TERMINAL_URL: http://terminal-runtime:8200
      CK_TERMINAL_SERVICE_TOKEN: ${CK_TERMINAL_SERVICE_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CK_TOOL_APPROVAL_TOKEN: ${CK_TOOL_APPROVAL_TOKEN:-}
      CK_TOOL_EXECUTION_TOKEN: ${CK_TOOL_EXECUTION_TOKEN:-}
    expose: ["8300"]
    depends_on:
      cognitive-bridge:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    networks: [app, runner]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8300/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  colony:
    image: cyclekernel-colony:latest
    build:
      context: ./master/src
      dockerfile: colony/Dockerfile
    environment:
      BRIDGE_URL: http://cognitive-bridge:8090
      CHAT_URL: http://chat:8300
      CK_ARTIFACT_ROOT: /artifacts
      PYTHONPATH: /app/src
    expose: ["8500"]
    volumes:
      - ck-artifacts:/artifacts
      - colony-data:/data
    depends_on:
      cognitive-bridge:
        condition: service_healthy
      chat:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8500/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongodb:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: cyclekernel
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    volumes:
      - mongodb-data:/data/db
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "${CYCLEKERNEL_PUBLISH_ADDR:-127.0.0.1}:9090:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "${CYCLEKERNEL_PUBLISH_ADDR:-127.0.0.1}:${GRAFANA_PUBLISH_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [app]
    restart: unless-stopped

  frontend:
    image: cyclekernel-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${CYCLEKERNEL_PUBLISH_ADDR:-127.0.0.1}:${CYCLEKERNEL_WEB_PORT:-8080}:80"
    depends_on:
      simulation:
        condition: service_healthy
      monitoring:
        condition: service_healthy
      chat:
        condition: service_healthy
      colony:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app:
  data:
    internal: true
  runner:
    internal: true

volumes:
  mongodb-data:
  redis-data:
  prometheus-data:
  grafana-data:
  ck-artifacts:
  colony-data:
  simulation-logs:
