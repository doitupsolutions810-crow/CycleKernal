global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cyclekernel'
    environment: 'production'

scrape_configs:
  # Simulation backend metrics
  - job_name: 'simulation'
    static_configs:
      - targets: ['simulation:5000']
        labels:
          service: 'simulation'
          component: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Monitoring backend metrics
  - job_name: 'monitoring'
    static_configs:
      - targets: ['monitoring:3000']
        labels:
          service: 'monitoring'
          component: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # MongoDB and Redis exporters are intentionally not scraped until
  # their exporter containers and endpoints have been deployed.

# Alerting rules (can be extended)
rule_files:
  # - 'alerts.yml'

# Alertmanager configuration (if needed)
